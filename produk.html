    <!-- =========================================================
         JAVASCRIPT

    <script>

        /* =====================================================
           NAVBAR MOBILE
        ====================================================== */

        function toggleNavbar() {

            const menu =
                document.getElementById("navbarMenu");

            const button =
                document.getElementById("navbarToggle");

            menu.classList.toggle("show");

            const isOpen =
                menu.classList.contains("show");

            button.setAttribute(
                "aria-expanded",
                isOpen
            );
        }


        /* =====================================================
           SCROLL KE HALAMAN KATALOG
        ====================================================== */

        function goToPage(pageNumber) {

            const target =
                document.getElementById(
                    "page-" + pageNumber
                );

            if (!target) {
                return;
            }

            const navbar =
                document.querySelector(
                    ".main-navbar"
                );

            const navigation =
                document.querySelector(
                    ".catalog-navigation-wrapper"
                );

            const navbarHeight =
                navbar
                    ? navbar.offsetHeight
                    : 0;

            const navigationHeight =
                navigation
                    ? navigation.offsetHeight
                    : 0;

            const offset =
                navbarHeight +
                navigationHeight +
                25;

            const targetTop =
                target.getBoundingClientRect().top +
                window.pageYOffset -
                offset;

            window.scrollTo({

                top: targetTop,

                behavior: "smooth"

            });
        }


        /* =====================================================
           KEMBALI KE ATAS
        ====================================================== */

        function scrollToTop() {

            window.scrollTo({

                top: 0,

                behavior: "smooth"

            });
        }


        /* =====================================================
           TOMBOL BACK TO TOP
        ====================================================== */

        window.addEventListener(
            "scroll",
            function () {

                const topButton =
                    document.getElementById(
                        "catalogTop"
                    );

                if (window.scrollY > 500) {

                    topButton.classList.add(
                        "show"
                    );

                } else {

                    topButton.classList.remove(
                        "show"
                    );
                }

            }
        );


        /* =====================================================
           TUTUP NAVBAR MOBILE SETELAH LINK DIPILIH
        ====================================================== */

        document
            .querySelectorAll(
                ".navbar-menu .nav-link"
            )
            .forEach(function (link) {

                link.addEventListener(
                    "click",
                    function () {

                        const menu =
                            document.getElementById(
                                "navbarMenu"
                            );

                        const button =
                            document.getElementById(
                                "navbarToggle"
                            );

                        menu.classList.remove(
                            "show"
                        );

                        button.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                    }
                );

            });


        /* =====================================================
           TUTUP NAVBAR JIKA KLIK DI LUAR MENU
        ====================================================== */

        document.addEventListener(
            "click",
            function (event) {

                const menu =
                    document.getElementById(
                        "navbarMenu"
                    );

                const button =
                    document.getElementById(
                        "navbarToggle"
                    );

                if (!menu || !button) {
                    return;
                }

                const clickedInsideMenu =
                    menu.contains(event.target);

                const clickedButton =
                    button.contains(event.target);

                if (
                    !clickedInsideMenu &&
                    !clickedButton &&
                    menu.classList.contains("show")
                ) {

                    menu.classList.remove(
                        "show"
                    );

                    button.setAttribute(
                        "aria-expanded",
                        "false"
                    );
                }

            }
        );

    </script>
